[workspace]
members = ["apps/*", "crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "UNLICENSED"

[workspace.dependencies]
mathscape-domain = { path = "crates/mathscape-domain" }
mathscape-fixture = { path = "crates/mathscape-fixture" }
mathscape-graph = { path = "crates/mathscape-graph" }
mathscape-llm = { path = "crates/mathscape-llm" }
mathscape-orchestrator = { path = "crates/mathscape-orchestrator" }
mathscape-query = { path = "crates/mathscape-query" }
mathscape-store-sqlite = { path = "crates/mathscape-store-sqlite" }
mathscape-tool-lean = { path = "crates/mathscape-tool-lean" }
mathscape-tool-marker = { path = "crates/mathscape-tool-marker" }
mathscape-validation = { path = "crates/mathscape-validation" }
serde = { version = "1", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "forbid"
