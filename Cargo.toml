[workspace]
members = ["apps/*", "crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "UNLICENSED"

[workspace.dependencies]
axum = { version = "=0.8.9", features = ["ws"] }
axum-server = { version = "=0.8.0", features = ["tls-rustls-no-provider"] }
rcgen = { version = "=0.14.10", features = ["x509-parser"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
getrandom = "0.3"
if-addrs = "0.15"
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
time = "0.3"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
futures = "0.3"
genai = "=0.6.5"
keyring = "=4.2.0"
mathscape-agent = { path = "crates/mathscape-agent" }
mathscape-artifact = { path = "crates/mathscape-artifact" }
mathscape-domain = { path = "crates/mathscape-domain" }
mathscape-fixture = { path = "crates/mathscape-fixture" }
mathscape-graph = { path = "crates/mathscape-graph" }
mathscape-ink-raster = { path = "crates/mathscape-ink-raster" }
mathscape-llm = { path = "crates/mathscape-llm" }
mathscape-mcp = { path = "crates/mathscape-mcp" }
mathscape-orchestrator = { path = "crates/mathscape-orchestrator" }
mathscape-pdf = { path = "crates/mathscape-pdf" }
mathscape-query = { path = "crates/mathscape-query" }
mathscape-resident = { path = "crates/mathscape-resident" }
mathscape-sandbox = { path = "crates/mathscape-sandbox" }
mathscape-store-sqlite = { path = "crates/mathscape-store-sqlite" }
mathscape-tool-lean = { path = "crates/mathscape-tool-lean" }
mathscape-tool-marker = { path = "crates/mathscape-tool-marker" }
mathscape-validation = { path = "crates/mathscape-validation" }
lopdf = "0.42"
# pdf.page_image rasterizer: pure Rust, forbids unsafe, no native library.
# Embedded standard-14 fonts and CJK CMaps; no SIMD feature. hayro 0.8 sets
# the workspace MSRV to 1.92.
hayro = { version = "0.8", default-features = false, features = ["embed-fonts", "embed-cmaps"] }
base64 = "0.22"
png = "0.17"
pdf-inspector = { version = "=1.17.0", default-features = false }
petgraph = { version = "0.8.3", default-features = false, features = ["stable_graph", "std"] }
pulldown-cmark = { version = "=0.13.4", default-features = false }
rusqlite = { version = "0.41.0", default-features = false, features = ["bundled"] }
schemars = "1"
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = "2.11.5"
tauri-build = "2.6.3"
tauri-plugin-dialog = "2.7.3"
thiserror = "2"
# Phase1d-b ink raster: no SIMD (bit-identical output on every CPU), no
# built-in PNG codec (the crate encodes RGB itself).
tiny-skia = { version = "0.11.4", default-features = false, features = ["std"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
url = { version = "2", features = ["serde"] }
wiremock = "0.6.5"

[workspace.lints.rust]
unsafe_code = "forbid"
