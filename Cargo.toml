[workspace]
members = ["apps/*", "crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "UNLICENSED"

[workspace.dependencies]
mathscape-artifact = { path = "crates/mathscape-artifact" }
mathscape-domain = { path = "crates/mathscape-domain" }
mathscape-fixture = { path = "crates/mathscape-fixture" }
mathscape-graph = { path = "crates/mathscape-graph" }
mathscape-llm = { path = "crates/mathscape-llm" }
mathscape-orchestrator = { path = "crates/mathscape-orchestrator" }
mathscape-pdf = { path = "crates/mathscape-pdf" }
mathscape-query = { path = "crates/mathscape-query" }
mathscape-store-sqlite = { path = "crates/mathscape-store-sqlite" }
mathscape-tool-lean = { path = "crates/mathscape-tool-lean" }
mathscape-tool-marker = { path = "crates/mathscape-tool-marker" }
mathscape-validation = { path = "crates/mathscape-validation" }
lopdf = "0.42"
pdf-inspector = { version = "=1.17.0", default-features = false }
petgraph = { version = "0.8.3", default-features = false, features = ["stable_graph", "std"] }
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = "2.11.5"
tauri-build = "2.6.3"
tauri-plugin-dialog = "2.7.3"
thiserror = "2"

[workspace.lints.rust]
unsafe_code = "forbid"
