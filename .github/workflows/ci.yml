name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Debug info would push the workspace test build past the runner's free disk.
  CARGO_PROFILE_DEV_DEBUG: "0"
  # Pinned so new Clippy lints arrive in a deliberate bump, not in an unrelated PR.
  RUST_TOOLCHAIN: "1.99.1"
  NODE_VERSION: "24"

jobs:
  changes:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      - uses: dorny/paths-filter@v3
        if: github.event_name == 'pull_request'
        id: filter
        with:
          predicate-quantifier: every
          filters: |
            rust:
              - '**'
              - '!docs/**'
              - '!issues/**'
              - '!*.md'
              - '!LICENSE'
              - '!NOTICE'
              - '!.github/ISSUE_TEMPLATE/**'
              - '!.github/pull_request_template.md'
              - '!.github/CODEOWNERS'
              # InkPad imports src/ink and the shared Markdown renderer.
              - '!frontend/src/!(ink|reader){,/**}'
              - '!frontend/src/reader/!(markdown.ts){,/**}'
              - '!frontend/tests/**'
              - '!frontend/ink-lab/**'
              - '!frontend/scripts/**'
              - '!frontend/*.md'
              - '!frontend/index.html'
              - '!frontend/i18n-baseline.json'
              - '!frontend/playwright*.config.ts'
              - '!frontend/vite.config.ts'
              - '!frontend/vite.ink.config.ts'
              - '!frontend/vitest.config.ts'

  rust:
    name: Rust (fmt, clippy, test)
    needs: changes
    # Skip the job, not the workflow, so the required check still reports a result.
    if: github.event_name != 'pull_request' || needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          rust-components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  frontend:
    name: Frontend (typecheck, unit, build)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run build

  playwright:
    name: Playwright (${{ matrix.browser }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npx playwright test --browser=${{ matrix.browser }}
      - name: InkLab server and browser tests
        if: matrix.browser == 'chromium'
        run: |
          npm run test:ink-server
          npm run test:ink-browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-${{ matrix.browser }}
          path: .test-runs/
          retention-days: 7
