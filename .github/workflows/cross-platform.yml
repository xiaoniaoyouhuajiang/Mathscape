name: Cross-platform

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Debug info would push the workspace test build past the runner's free disk.
  CARGO_PROFILE_DEV_DEBUG: "0"
  RUST_TOOLCHAIN: "1.99.1"
  NODE_VERSION: "24"

jobs:
  test:
    name: cargo test (${{ matrix.os }})
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref_type == 'branch') ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci:full'))
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: cargo test --workspace --locked --no-fail-fast

  package:
    name: tauri build (${{ matrix.os }})
    if: >-
      (github.event_name == 'push' && github.ref_type == 'tag') ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci:full'))
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            bundles: deb
            installer: "*.deb"
          - os: macos-latest
            bundles: dmg
            installer: "*.dmg"
          - os: windows-latest
            bundles: nsis
            installer: "*-setup.exe"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          cache-key: package
          build-frontend: "false"
      - name: tauri build
        shell: bash
        working-directory: apps/mathscape-desktop
        run: |
          node -e '
            const config = { bundle: { active: true } };
            if (process.env.GITHUB_REF_TYPE === "tag") config.version = process.env.GITHUB_REF_NAME.slice(1);
            require("node:fs").writeFileSync("tauri.ci.json", JSON.stringify(config));
          '
          node ../../frontend/node_modules/@tauri-apps/cli/tauri.js build \
            --config tauri.ci.json --bundles ${{ matrix.bundles }}
      - uses: actions/upload-artifact@v4
        with:
          name: mathscape-${{ matrix.os }}-${{ matrix.bundles }}
          path: target/release/bundle/${{ matrix.bundles }}/${{ matrix.installer }}
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: package
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: mathscape-*
          path: release-assets
      - name: Create release with installers
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" release-assets/*/* --verify-tag --generate-notes
