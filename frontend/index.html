<!doctype html>
<html lang="zh-CN">
  <head>
    <script>
      // Apply before CSS/first paint, including when storage is unavailable.
      try {
        const theme = localStorage.getItem("mathscape.theme");
        document.documentElement.dataset.theme = ["obsidian", "parchment", "slate"].includes(theme) ? theme : "obsidian";
      } catch { document.documentElement.dataset.theme = "obsidian"; }
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f1720" />
    <title>Mathscape</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
