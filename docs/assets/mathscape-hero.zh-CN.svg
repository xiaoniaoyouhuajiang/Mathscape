<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
  <title id="title">Mathscape · 数学景观 — 让散落的数学，连成可探索的知识景观。</title>
  <desc id="description">概念插画，非应用截图。高亮的数学来源连接到由定义、定理与证明组成的星图。本地优先、来源可溯、人工审核。</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#f7f5ef"/>
      <stop offset="1" stop-color="#efece3"/>
    </linearGradient>
    <radialGradient id="nebula">
      <stop stop-color="#cdbb8c" stop-opacity=".19"/>
      <stop offset="1" stop-color="#cdbb8c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="thread" x2="1" y2="0">
      <stop stop-color="#b5791f"/>
      <stop offset="1" stop-color="#a9cce6"/>
    </linearGradient>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#26538d" stroke-opacity=".045"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="180%" height="180%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#706451" flood-opacity=".16"/>
    </filter>
    <style>
      text { font-family: 'Noto Sans CJK SC', 'DejaVu Sans', sans-serif; }
      .serif { font-family: 'Noto Serif CJK SC', 'DejaVu Serif', serif; }
      .mono { font-family: 'DejaVu Sans Mono', monospace; }
    </style>
  </defs>

  <path fill="url(#background)" d="M0 0h1600v900H0z"/>
  <path fill="url(#grid)" d="M0 0h1600v900H0z"/>
  <ellipse cx="1215" cy="405" rx="640" ry="580" fill="url(#nebula)"/>
  <g fill="none" stroke="#b5791f" stroke-opacity=".09">
    <ellipse cx="1265" cy="410" rx="380" ry="310" transform="rotate(-24 1265 410)"/>
    <ellipse cx="1265" cy="410" rx="300" ry="405" transform="rotate(-24 1265 410)"/>
    <path d="M870 60l540 640M825 580l715-310"/>
  </g>
  <g fill="#26538d" opacity=".22">
    <circle cx="742" cy="142" r="2"/><circle cx="1060" cy="91" r="2"/>
    <circle cx="1450" cy="180" r="2"/><circle cx="1520" cy="548" r="2"/>
    <circle cx="795" cy="681" r="2"/><circle cx="1384" cy="697" r="2"/>
    <circle cx="651" cy="555" r="1.5"/><circle cx="1200" cy="664" r="1.5"/>
  </g>

  <!-- The existing app icon's constellation, redrawn as a small wordmark. -->
  <g transform="translate(76 65)" fill="none" stroke="#26538d" stroke-width="2">
    <path d="M2 32L13 5l12 18 12 4L50 3l13 19 10 14"/>
    <g fill="#26538d" stroke="none">
      <circle cx="2" cy="32" r="3.5"/><circle cx="13" cy="5" r="3.5"/>
      <circle cx="25" cy="23" r="3.5"/><circle cx="37" cy="27" r="3.5"/>
      <circle cx="50" cy="3" r="3.5"/><circle cx="63" cy="22" r="3.5"/>
      <circle cx="73" cy="36" r="3.5"/>
    </g>
  </g>
  <text x="170" y="99" fill="#1a2433" font-size="35" font-weight="600" letter-spacing="-.8">Mathscape</text>
  <text x="1520" y="92" text-anchor="end" fill="#556275" font-size="15" letter-spacing="2.5">属于你的数学工作空间</text>

  <!-- Editorial headline: intentionally separate from the concept map. -->
  <text x="80" y="218" fill="#b5791f" font-size="16" letter-spacing="3">阅读 · 连接 · 理解</text>
  <text class="serif" x="76" y="310" fill="#1a2433" font-size="68" letter-spacing="-2.8">让散落的数学，</text>
  <text class="serif" x="76" y="398" fill="#1a2433" font-size="68" letter-spacing="-2.8">连成可探索的</text>
  <text class="serif" x="76" y="486" fill="#26538d" font-size="68" letter-spacing="-2.8">知识景观。</text>
  <text x="80" y="553" fill="#556275" font-size="23">从数学材料出发，</text>
  <text x="80" y="589" fill="#556275" font-size="23">连接一张可以追溯的知识地图。</text>
  <path d="M80 637h48" stroke="#b5791f" stroke-width="2"/>
  <text x="145" y="644" fill="#354356" font-size="18">本地优先 · 来源可溯 · 人工审核</text>

  <!-- Editorial contrast: paper outside, a deep-blue mathematical atlas inside. -->
  <rect x="918" y="130" width="650" height="544" rx="26" fill="#112139"/>
  <rect x="918" y="130" width="650" height="544" rx="26" fill="url(#grid)" stroke="#26538d" stroke-opacity=".16"/>
  <g>
  <!-- An illustrative mathematical constellation, not fabricated product UI. -->
  <g fill="none" stroke="#a9cce6" stroke-width="2">
    <path d="M1020 327L1197 233 1390 360 1290 532 1110 575 1020 327" opacity=".65"/>
    <path d="M1020 327L1290 532M1197 233l-87 342M1197 233l93 299M1110 575l280-215" opacity=".22"/>
    <path d="M940 473C1055 473 1088 378 1197 233" stroke="url(#thread)" stroke-width="3"/>
  </g>
  <path d="M984 343Q1095 395 1178 510Q1248 576 1362 489Q1438 394 1364 332Q1270 237 1136 269Q1023 265 984 343Z" fill="#a9cce6" fill-opacity=".035" stroke="#a9cce6" stroke-opacity=".17" stroke-dasharray="5 9"/>

  <g>
    <circle cx="1197" cy="233" r="33" fill="#a9cce6" fill-opacity=".08"/>
    <circle cx="1197" cy="233" r="18" fill="#142940" stroke="#a9cce6" stroke-width="2"/>
    <circle cx="1197" cy="233" r="5" fill="#a9cce6"/>
    <text x="1197" y="177" text-anchor="middle" fill="#a9cce6" font-size="14" letter-spacing="2">定义</text>
    <text class="serif" x="1197" y="204" text-anchor="middle" fill="#f5f1e8" font-size="23">内积</text>

    <circle cx="1390" cy="360" r="24" fill="#dfbd79" fill-opacity=".1"/>
    <circle cx="1390" cy="360" r="10" fill="#dfbd79"/>
    <text x="1430" y="344" fill="#dfbd79" font-size="13" letter-spacing="1.6">定理</text>
    <text class="serif" x="1430" y="372" fill="#f5f1e8" font-size="22">柯西–施瓦茨</text>
    <text class="serif" x="1430" y="400" fill="#f5f1e8" font-size="22">不等式</text>

    <circle cx="1290" cy="532" r="32" fill="#a9cce6" fill-opacity=".08"/>
    <circle cx="1290" cy="532" r="16" fill="#142940" stroke="#a9cce6" stroke-width="2"/>
    <circle cx="1290" cy="532" r="4" fill="#a9cce6"/>
    <text x="1322" y="549" fill="#a9cce6" font-size="14" letter-spacing="2">证明</text>
    <text class="serif" x="1322" y="579" fill="#f5f1e8" font-size="23">缺失的一步</text>

    <circle cx="1110" cy="575" r="7" fill="#a9cce6"/>
    <text x="1104" y="615" text-anchor="middle" fill="#b7c8d6" font-size="18">你的笔记</text>
    <circle cx="1020" cy="327" r="7" fill="#a9cce6"/>
    <text x="1044" y="333" fill="#b7c8d6" font-size="18">向量空间</text>
  </g>

  </g>

  <!-- Source card uses real, elementary mathematics as illustrative content. -->
  <g transform="translate(740 390) rotate(-6 145 128)">
    <rect width="290" height="256" rx="10" fill="#faf9f5" stroke="#dad5c8" filter="url(#shadow)"/>
    <path d="M26 41h22" stroke="#b5791f" stroke-width="2"/>
    <text x="59" y="46" fill="#556275" font-size="12" letter-spacing="2">数学材料（示意）</text>
    <text class="serif" x="26" y="87" fill="#1a2433" font-size="22">内积空间 · 材料片段</text>
    <path d="M26 110h235M26 125h193" stroke="#1a2433" stroke-opacity=".18" stroke-width="3"/>
    <rect x="19" y="145" width="252" height="44" rx="3" fill="#eee0bb"/>
    <text class="serif" x="145" y="174" text-anchor="middle" fill="#1a2433" font-size="21">|⟨u, v⟩|² ≤ ⟨u, u⟩⟨v, v⟩</text>
    <path d="M26 211h172M26 226h215" stroke="#1a2433" stroke-opacity=".18" stroke-width="3"/>
  </g>
  <text x="1520" y="700" text-anchor="end" fill="#556275" font-size="13" letter-spacing="1.2">概念插画 · 非应用截图</text>

  <path d="M80 748h1440" stroke="#26538d" stroke-opacity=".18"/>
  <g font-size="20" fill="#354356">
    <text class="mono" x="80" y="805" fill="#b5791f" font-size="15">01</text>
    <text x="118" y="806">导入数学材料</text>
    <text class="mono" x="452" y="805" fill="#b5791f" font-size="15">02</text>
    <text x="490" y="806">追溯来源依据</text>
    <text class="mono" x="860" y="805" fill="#b5791f" font-size="15">03</text>
    <text x="898" y="806">审核候选提案</text>
    <text class="mono" x="1230" y="805" fill="#b5791f" font-size="15">04</text>
    <text x="1268" y="806">探索知识地图</text>
  </g>
  <text x="80" y="857" fill="#556275" font-size="14" letter-spacing="1">开源 · 实验阶段</text>
  <text class="mono" x="1520" y="857" text-anchor="end" fill="#556275" font-size="14">github.com/xiaoniaoyouhuajiang/Mathscape</text>
</svg>
