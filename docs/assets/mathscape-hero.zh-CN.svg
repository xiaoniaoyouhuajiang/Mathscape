<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
  <title id="title">Mathscape · 数学景观 — 让数学，长成一片景观。</title>
  <desc id="description">原创概念插画，非应用截图：一本展开的数学图册长成折纸山峦，金色的 M 形星路从书页通向山顶，呼应 Mathscape 的星图图标。本地优先、来源可溯、人工审核。</desc>
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0b1427"/><stop offset=".6" stop-color="#142a43"/><stop offset="1" stop-color="#0c1c32"/>
    </linearGradient>
    <radialGradient id="atmosphere">
      <stop stop-color="#588398" stop-opacity=".26"/><stop offset="1" stop-color="#588398" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="leftPage" x2=".9" y2="1">
      <stop stop-color="#faf6ea"/><stop offset="1" stop-color="#dcd5bf"/>
    </linearGradient>
    <linearGradient id="rightPage" x2="1" y2=".5">
      <stop stop-color="#c4c8be"/><stop offset=".15" stop-color="#f5efdf"/><stop offset="1" stop-color="#e4dcc8"/>
    </linearGradient>
    <linearGradient id="ridge" x2="1" y2="0">
      <stop stop-color="#b98235"/><stop offset=".5" stop-color="#ecd49a"/><stop offset="1" stop-color="#e5ba61"/>
    </linearGradient>
    <radialGradient id="beacon">
      <stop stop-color="#f4d997" stop-opacity=".35"/><stop offset="1" stop-color="#f4d997" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="20"/></filter>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#030a14" flood-opacity=".4"/>
    </filter>
    <pattern id="dots" width="48" height="48" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#bbd1e2" opacity=".12"/>
    </pattern>
    <style>
      text { font-family: 'Noto Sans CJK SC', 'DejaVu Sans', sans-serif; }
      .serif { font-family: 'Noto Serif CJK SC', 'DejaVu Serif', serif; }
      .mono { font-family: 'DejaVu Sans Mono', monospace; }
    </style>
  </defs>

  <path d="M0 0h1600v900H0z" fill="url(#night)"/>
  <ellipse cx="925" cy="545" rx="790" ry="440" fill="url(#atmosphere)"/>
  <path d="M0 300h1600v510H0z" fill="url(#dots)"/>

  <!-- Cartographic arcs, not a generic network of labelled UI nodes. -->
  <g fill="none" stroke="#adc5d5" stroke-width="1" opacity=".09">
    <ellipse cx="840" cy="655" rx="665" ry="167" transform="rotate(-8 840 655)"/>
    <ellipse cx="840" cy="655" rx="735" ry="211" transform="rotate(-8 840 655)"/>
    <ellipse cx="840" cy="655" rx="815" ry="260" transform="rotate(-8 840 655)"/>
    <path d="M140 692l1390-196M925 315L745 820"/>
  </g>

  <g transform="translate(78 55)" fill="none" stroke="#d5e2ed" stroke-width="2">
    <path d="M2 32L13 5l12 18 12 4L50 3l13 19 10 14"/>
    <g fill="#f2d69b" stroke="none">
      <circle cx="2" cy="32" r="3"/><circle cx="13" cy="5" r="3"/>
      <circle cx="25" cy="23" r="3"/><circle cx="37" cy="27" r="3"/>
      <circle cx="50" cy="3" r="4"/><circle cx="63" cy="22" r="3"/>
      <circle cx="73" cy="36" r="3"/>
    </g>
  </g>
  <text x="174" y="87" fill="#f6f0e3" font-size="34" font-weight="600" letter-spacing="-.8">Mathscape</text>
  <text x="1520" y="80" text-anchor="end" fill="#b1c7d5" font-size="14" letter-spacing="3">从一页数学，到一片景观</text>

  <text class="serif" x="800" y="204" text-anchor="middle" fill="#f6f0e3" font-size="77" letter-spacing="-2.7">让数学，长成一片景观。</text>
  <text x="800" y="258" text-anchor="middle" fill="#b7cbd9" font-size="23">以材料为起点，让每一次理解，都找到自己的位置。</text>

  <!-- An open book is the ground, not a floating source card. -->
  <ellipse cx="831" cy="781" rx="526" ry="38" fill="#030a14" opacity=".55" filter="url(#blur)"/>
  <g filter="url(#softShadow)">
    <path d="M245 651L322 434Q584 463 800 535Q1046 436 1330 424L1407 643Q1084 722 800 812Q552 747 245 672Z" fill="#647987"/>
    <path d="M255 638Q536 711 800 789Q1084 706 1395 621L1399 638Q1098 726 800 804Q526 725 251 655Z" fill="#b6b3a6"/>
    <path d="M255 638Q536 711 800 789Q1084 706 1395 621M253 645Q532 718 800 796Q1091 716 1397 630" fill="none" stroke="#f1e9d6" stroke-width="2"/>
    <path d="M800 782Q535 702 255 638L330 424Q590 453 800 523Z" fill="url(#leftPage)"/>
    <path d="M800 782Q1080 706 1392 620L1325 415Q1050 435 800 523Z" fill="url(#rightPage)"/>
    <path d="M800 523Q780 659 800 782" fill="none" stroke="#9b9c8f" stroke-width="3" opacity=".65"/>
    <path d="M330 424Q590 453 800 523Q1050 435 1325 415" fill="none" stroke="#fff9e9" stroke-width="2"/>
  </g>

  <!-- Quiet source-page typography becomes part of the terrain. -->
  <g stroke="#6c7a7b" stroke-width="2" opacity=".3">
    <path d="M351 470l164 39M344 486l145 35M337 502l122 30M303 596l112 30M298 612l86 23"/>
    <path d="M1216 468l91-17M1230 484l84-16M1245 500l74-14M1257 563l79-20M1263 580l78-20"/>
  </g>

  <!-- Two paper peaks form the M in Mathscape's constellation. -->
  <g>
    <path d="M425 650L700 415 850 610 740 716Z" fill="#b8c4c9"/>
    <path d="M425 650L700 415 680 622 740 716Z" fill="#e5ddc8"/>
    <path d="M700 415L850 610 680 622Z" fill="#f8f1dc"/>
    <path d="M680 622L850 610 740 716Z" fill="#91a8b5"/>
    <path d="M820 704L1035 350 1250 615 1070 711Z" fill="#9eafb8"/>
    <path d="M820 704L1035 350 1060 577 1070 711Z" fill="#eee5cf"/>
    <path d="M1035 350L1250 615 1060 577Z" fill="#fbf3df"/>
    <path d="M1060 577L1250 615 1070 711Z" fill="#b8c6cc"/>
  </g>

  <!-- Faceted elevation contours make this a mathematical landscape. -->
  <g fill="none" stroke="#536e7c" stroke-width="1.2" opacity=".36">
    <path d="M659 450L697 446 723 444M631 474L695 467 738 464M604 497L693 488 753 483M576 521L691 509 768 503M549 544L689 529 783 522M521 568L687 550 798 542M494 591L685 571 813 561M466 615L683 591 828 581M439 638L681 612 843 600"/>
    <path d="M1003 403L1039 384 1067 390M981 439L1041 407 1089 416M960 474L1044 429 1110 443M938 510L1046 452 1132 469M917 545L1049 475 1153 496M895 580L1051 497 1175 522M874 616L1054 520 1196 549M852 651L1056 543 1218 575M831 687L1059 565 1239 602"/>
    <path d="M680 622L740 716M1060 577L1070 711" opacity=".5"/>
  </g>

  <!-- The signature M-shaped route emerges from the source pages. -->
  <path d="M425 650L700 415 850 610 1035 350 1250 615" fill="none" stroke="#142a43" stroke-width="7" stroke-linejoin="round" opacity=".5"/>
  <path d="M425 650L700 415 850 610 1035 350 1250 615" fill="none" stroke="url(#ridge)" stroke-width="3.5" stroke-linejoin="round"/>
  <g fill="#f7e7bd" stroke="#a17835" stroke-width="2">
    <circle cx="425" cy="650" r="7"/><circle cx="700" cy="415" r="8"/>
    <circle cx="850" cy="610" r="7"/><circle cx="1250" cy="615" r="7"/>
  </g>
  <circle cx="1035" cy="350" r="67" fill="url(#beacon)"/>
  <path d="M1035 323L1041 343 1061 350 1041 356 1035 377 1029 356 1009 350 1029 343Z" fill="#f4d58c"/>
  <circle cx="1035" cy="350" r="4" fill="#fff9df"/>

  <!-- A few distant connections imply a larger atlas beyond the page. -->
  <g fill="none" stroke="#a9c6d9" stroke-width="1.3" opacity=".4">
    <path d="M1035 350L1228 324 1374 397M700 415L532 364 388 405" stroke-dasharray="3 7"/>
  </g>
  <g fill="#bfd3df">
    <circle cx="1228" cy="324" r="3"/><circle cx="1374" cy="397" r="3"/>
    <circle cx="532" cy="364" r="3"/><circle cx="388" cy="405" r="3"/>
  </g>

  <text x="1520" y="816" text-anchor="end" fill="#91acbe" font-size="11" letter-spacing="1.1">概念插画 · 非应用截图</text>
  <path d="M80 842h1440" stroke="#b7cbd9" stroke-opacity=".2"/>
  <text x="80" y="878" fill="#d8e3e9" font-size="16" letter-spacing=".3">本地优先 · 来源可溯 · 人工审核</text>
  <text class="mono" x="1520" y="878" text-anchor="end" fill="#91acbe" font-size="13">开源 / 实验阶段</text>
</svg>
